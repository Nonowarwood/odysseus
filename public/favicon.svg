<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Rose des vents de portulan : c'est le motif qui structure déjà la carte, et
    l'un des rares qui reste lisible à seize pixels. Les branches sont pleines
    plutôt que filaires — un trait fin disparaîtrait à cette taille — et chaque
    pointe est en deux valeurs, comme sur les roses gravées.
  -->
  <rect width="64" height="64" fill="#060d16"/>

  <g transform="translate(32 32)">
    <circle r="22" fill="none" stroke="#C9A227" stroke-opacity=".4" stroke-width="1.5"/>

    <g transform="rotate(45)">
      <path d="M0-18 3.5 0 0 18-3.5 0Z" fill="#C9A227" fill-opacity=".5"/>
      <path d="M-18 0 0 3.5 18 0 0-3.5Z" fill="#C9A227" fill-opacity=".5"/>
    </g>

    <path d="M-27 0 0 5 27 0 0-5Z" fill="#C9A227"/>
    <path d="M-27 0 0 5 0 0Z" fill="#9D7D24"/>
    <path d="M0-27 5 0 0 27-5 0Z" fill="#F0CF6A"/>
    <path d="M0-27 5 0 0 0Z" fill="#9D7D24"/>

    <circle r="2.2" fill="#060d16"/>
  </g>
</svg>
